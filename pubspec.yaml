name: checkandgo_app
description: "여행 체크리스트 관리 앱"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.8.0

  # State Management
  provider: ^6.1.2

  # Backend & Database
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  supabase_flutter: ^2.9.1

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.10+1
  http: ^1.2.0

  # Charts
  fl_chart: ^0.70.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/pics/cg.png
